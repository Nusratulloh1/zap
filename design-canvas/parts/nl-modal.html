<div style="width: 540px; background: #0E0E0C; padding: 40px; font-family: 'Manrope', Helvetica, Arial, sans-serif">
<div id="zmodal-card" style="position:relative;width:460px;background:#F5F3EE;color:#3E3C35;border-radius:26px;padding:32px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
        <div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:#8A887E">ЗАЯВКА ПАРТНЁРА</div>
          <div style="margin-top:10px;font-weight:800;letter-spacing:-.02em;font-size:26px;line-height:1.1;color:#111110">Стать партнёром ZAP!</div>
        </div>
        <button type="button" id="zmodal-close" aria-label="Закрыть" style="flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid #E3E1D8;background:#FFFFFF;color:#3E3C35;font-size:17px;line-height:1;cursor:pointer">×</button>
      </div>
      <div id="zmodal-body" style="margin-top:22px;display:flex;flex-direction:column;gap:12px">
        <input id="zf-venue" type="text" placeholder="Название заведения" style="width:100%;padding:15px 16px;border:1px solid #E3E1D8;border-radius:14px;background:#FFFFFF;font-family:Manrope,sans-serif;font-size:15px;color:#111110" />
        <input id="zf-city" type="text" placeholder="Город и адрес" style="width:100%;padding:15px 16px;border:1px solid #E3E1D8;border-radius:14px;background:#FFFFFF;font-family:Manrope,sans-serif;font-size:15px;color:#111110" />
        <input id="zf-phone" type="tel" placeholder="+998 __ ___ __ __" style="width:100%;padding:15px 16px;border:1px solid #E3E1D8;border-radius:14px;background:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:15px;color:#111110" />
        <button type="button" id="zmodal-send" style="margin-top:6px;width:100%;padding:16px 0;border:none;border-radius:999px;background:#111110;color:#DDFF33;font-family:Manrope,sans-serif;font-weight:800;font-size:15px;cursor:pointer">Отправить заявку</button>
        <div style="font-size:12px;line-height:1.5;color:#8A887E">Ответим в течение рабочего дня. Комиссия 3% с фактического сплита, абонентской платы нет.</div>
      </div>
      <div id="zmodal-done" style="display:none;margin-top:22px">
        <div style="font-weight:800;font-size:20px;letter-spacing:-.02em;color:#111110">Заявка отправлена.</div>
        <div style="margin-top:10px;font-size:15px;line-height:1.5;color:#5B594F">Мы свяжемся по указанному номеру и привезём QR-комплект.</div>
      </div>
    </div>
</div>
