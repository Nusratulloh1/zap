# ЛОКАЛЬНАЯ разработка: Postgres на НЕпродовом порту 5433 + Adminer :8081.
# Запуск: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: zap
      POSTGRES_PASSWORD: zap
      POSTGRES_DB: zap
    command: ['postgres', '-c', 'log_statement=none']
    volumes:
      - zap_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zap']
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  zap_pg_dev:
